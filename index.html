function msgSolde(x){const i=soldeInfo(x),n=((x.prenom||"")+" "+x.nom).trim();if(i.mois)return`Bonjour, pour ${n} (${i.mo}) : tarif du mois ${F(i.du)}, payé ${F(i.paye)}, ${i.reste>0?"reste à payer "+F(i.reste):"soldé"}. Merci pour votre confiance. Maître Pro`;return`Bonjour, pour ${n} : total dû ${F(i.du)}, payé ${F(i.paye)}, ${i.reste>0?"reste à payer "+F(i.reste):"solde à jour"}. Merci pour votre confiance. Maître Pro`}
function relancesHtml(){const d=new Date().getUTCDate(),mo=today().slice(0,7),im=S.st.filter(x=>!x.archive&&x.rate>0&&x.rate_unit=="mois"&&S.pa.filter(p=>p.student_id==x.id&&(p.date||"").startsWith(mo)).reduce((t,p)=>t+ +p.amount,0)<x.rate);
 const jour=[5,10,15,20,25].includes(d)?`<p><b>Aujourd’hui, c’est une date de relance.</b>${d==25?" C’est le dernier délai de paiement.":""}</p>`:"";
 return `<div class=card><h3>Relances du mois (${mo})</h3>${jour}<div style="margin:8px 0;padding:8px;border-radius:8px;background:#EEF3FB"><b>Relances automatiques</b> : 5, 10, 15, 20 et 25 du mois, à 8 h, sur le téléphone des parents non soldés. Le 25 est le dernier délai. <div class=row style="margin-top:6px"><button onclick="relAuto(true)">Activer</button> <button class=s onclick="relAuto(false)">Désactiver</button></div></div>${im.map(x=>{const w=intl(x.parent_tel),reste=soldeInfo(x).reste,msg=`Bonjour, nous vous rappelons que le paiement des frais de répétition de ${((x.prenom||"")+" "+x.nom).trim()} pour ${mo} n’est pas encore reçu. Reste à payer : ${F(reste)}. Merci de régulariser avant le 25 du mois. Si vous avez déjà payé, ignorez ce message. Merci pour votre confiance.`;return `<div style="margin:6px 0">${e(nom(x.id))} : ${F(x.rate)} <a class=btn style="display:inline-block;width:auto" target=_blank href="https://wa.me/${w}?text=${encodeURIComponent(msg)}">Ouvrir le rappel WhatsApp</a> <button class=s style="width:auto" onclick="notifRelance('${x.id}','${mo}')">Notifier sur l’application</button></div>`}).join("")||"<p>Tous les élèves sont à jour ce mois.</p>"}<p><small>Le message s’ouvre dans WhatsApp : vous relisez, puis vous touchez Envoyer.</small></p></div>`}
function renderPM(){const mo=document.getElementById("pmois").value||today().slice(0,7),L=S.st.filter(x=>!x.archive&&x.rate>0&&x.rate_unit=="mois").sort((a,b)=>nom(a.id).localeCompare(nom(b.id)));
 const rows=L.map(x=>{const p=S.pa.filter(y=>y.student_id==x.id&&(y.date||"").startsWith(mo)).reduce((t,y)=>t+ +y.amount,0);return{x,p,st:p>=x.rate?"ok":p>0?"part":"non"}});
 const c={ok:rows.filter(r=>r.st=="ok").length,part:rows.filter(r=>r.st=="part").length,non:rows.filter(r=>r.st=="non").length};
 const bg={ok:"#C6EFCE",part:"#FFD966",non:"#F4B6B6"},tx={ok:"✔ payé",part:"◐ partiel",non:"✘ non payé"};
 const recap=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0"><span style="background:#C6EFCE;padding:4px 8px;border-radius:6px">Payés : ${c.ok}</span><span style="background:#FFD966;padding:4px 8px;border-radius:6px">Partiels : ${c.part}</span><span style="background:#F4B6B6;padding:4px 8px;border-radius:6px">Non payés : ${c.non}</span></div>`;
 document.getElementById("pmt").innerHTML=recap+rows.map(r=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px;margin:4px 0;border-radius:8px;background:${bg[r.st]};flex-wrap:wrap"><span><b>${e(nom(r.x.id))}</b> : ${F(r.x.rate)}</span><span>${tx[r.st]}${r.st=="part"?" : "+F(r.p):""}</span>${r.st=="ok"?"":`<button class=s data-pm="${r.x.id}" data-mo="${mo}" data-amt="${r.x.rate-r.p}">+ Payer</button>`}</div>`).join("")||"<p>Aucun élève au forfait mensuel.</p>"}
async function pmClick(ev){const b=ev.target.closest("[data-pm]");if(!b)return;const x=S.st.find(y=>y.id==b.dataset.pm),mo=b.dataset.mo,amt=+b.dataset.amt,date=mo==today().slice(0,7)?today():mo+"-01";
 if(!confirm("Enregistrer "+F(amt)+" pour "+nom(x.id)+" (mois "+mo+") ?"))return;
 const r=await sb.from("payments").insert({student_id:x.id,date,amount:amt,mode:"Non précisé",note:"Mois "+mo});if(r.error)return alert(r.error.message);await load();renderPM();alert("Paiement enregistré.")}
function notifyToday(){try{if(!("Notification" in window)||Notification.permission!=="granted")return;const t=today(),k="notif-"+t;if(localStorage.getItem(k))return;const L=S.se.filter(x=>x.date==t&&x.status=="prévue"&&x.duree>0).sort((a,b)=>(a.heure||"").localeCompare(b.heure||""));if(!L.length)return;localStorage.setItem(k,"1");new Notification("Maître Pro : "+L.length+" cours aujourd’hui",{body:L.map(x=>(x.heure||"").slice(0,5)+" "+nom(x.student_id)+" ("+(x.matiere||"")+")").join("\n"),icon:"icon-192.png"})}catch{}}
function notesHtml(id){const all=S.gr.filter(x=>x.student_id==id).sort((a,b)=>b.date.localeCompare(a.date)),avg=a=>a.length?(a.reduce((t,y)=>t+y.note/y.sur*20,0)/a.length).toFixed(1):"";
 return [["école","Notes de classe (école)"],["séance","Notes de séance (répétition)"]].map(([o,l])=>{const g=all.filter(x=>(x.origine||"école")==o);return `<p><b>${l}</b>${g.length?", moyenne "+avg(g)+"/20":""}</p>`+(g.map(x=>`<div>${dt(x.date)} ${e(x.type)}, ${e(x.matiere)} : <b>${x.note}/${x.sur}</b> ${x.photo?`<button class=s data-a=pdoc data-i="${e(x.photo)}">Photo</button> `:""}<button class=s data-a=dgr data-i=${x.id}>Supprimer</button></div>`).join("")||"<div>Aucune note.</div>")}).join("")}
function dossier(){const s=S.st.find(x=>x.id==S.cur),se=S.se.filter(x=>x.student_id==s.id&&x.duree>0).sort((a,b)=>b.date.localeCompare(a.date)),pa=S.pa.filter(x=>x.student_id==s.id).sort((a,b)=>b.date.localeCompare(a.date)),ph=se.flatMap(x=>x.photos||[]),dc=S.dc.filter(x=>x.student_id==s.id);
 $("#m").innerHTML=`<button class=s data-a=bk>← Élèves</button><div class=card><h3>${e(s.prenom)} ${e(s.nom)}</h3>${e(s.classe)} ${e(s.etablissement)}, ${e(s.matieres)}<br>Parent : ${e(s.parent_nom)} ${e(s.parent_tel)}<br>Tarif : ${F(s.rate)} par ${s.rate_unit}<br><b>Payé ${F(paid(s.id))}, ${due(s.id)>0?`<span class=due>reste ${F(due(s.id))}</span>`:"soldé"}</b><div class=row><button data-a=ed data-i=${s.id}>Modifier</button><button data-a=ns>+ Séance</button><button data-a=np>+ Paiement</button><button class=s data-a=rap2 data-i=${s.id}>Rappel</button><button class=s data-a=arc data-i=${s.id}>${s.archive?"Réactiver":"Archiver"}</button><button class=s data-a=dst data-i=${s.id}>Supprimer</button></div>${s.parent_tel?`<div class=row><a class=btn href="tel:+${intl(s.parent_tel)}">Appeler le parent</a><a class=btn target=_blank href="https://wa.me/${intl(s.parent_tel)}?text=${encodeURIComponent(msgSolde(s))}">WhatsApp : envoyer le solde</a></div>`:""}</div>
 <div class=card><h3>Séances</h3>${se.map(x=>`<div>${dt(x.date)} ${e(x.matiere)}, ${x.duree} min, ${F(x.amount)} <span class=b>${x.status}</span> <button class=s data-a=rap data-i=${x.id}>Rapport PDF</button> <button class=s data-a=es data-i=${x.id}>Modifier</button> <button class=s data-a=dse data-i=${x.id}>Supprimer</button></div>`).join("")||"Aucune séance."}</div>
 <div class=card><h3>Frais mensuels</h3>${S.se.filter(x=>x.student_id==s.id&&x.duree==0).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div>${e(x.matiere)} : ${F(x.amount)}</div>`).join("")||"Aucun frais enregistré."}</div>
 <div class=card><h3>Paiements</h3>${pa.map(x=>`<div>${dt(x.date)} ${F(x.amount)} (${e(x.mode)}), reste ${F(detail(x).reste)} <button class=s data-a=rec data-i=${x.id}>Reçu</button> <button class=s data-a=dpa data-i=${x.id}>Supprimer</button></div>`).join("")||"Aucun paiement."}</div>
 <div class=card><h3>Notes</h3>${notesHtml(s.id)}<div class=row><button data-a=ng>+ Note</button><button class=s data-a=fn data-i=${s.id}>Fiche de notes PDF</button></div></div>
 <div class=card><h3>Photos</h3>${ph.map(p=>`<img data-p="${p}" width=90 height=90>`).join("")||"Aucune photo."}</div>
 <div class=card><h3>Espace parent</h3>${S.pl.filter(x=>x.student_id==s.id).map(x=>`<div>${e(shown(x.parent_email))} <button class=s data-a=dpl data-i=${x.id}>Retirer</button></div>`).join("")||"Aucun accès parent."}<button data-a=npl data-i=${s.id}>+ Créer l’accès d’un parent</button></div>
 <div class=card><h3>Messages</h3>${S.ms.filter(x=>x.student_id==s.id).sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,10).map(x=>`<div><small>${x.created_at.slice(0,10)}, ${x.sender=="parent"?"Parent":"Vous"}</small><br>${e(x.body)}</div>`).join("")||"Aucun message."}<button data-a=rep data-i=${s.id}>Écrire au parent</button></div>
 <div class=card><h3>Historique des documents</h3>${dc.map(x=>`<div>${LAB[x.kind]} <span class=b>${ST[x.status]}</span> <button class=s data-a=doc data-i=${x.id}>Ouvrir</button> <button class=s data-a=ddc data-i=${x.id}>Supprimer</button></div>`).join("")||"Aucun document."}</div>`;

function niveau(c){const t=fold(c);if(/2nde|1re|tle|lyc/.test(t))return"Lycée";if(/[3456]\s*(e|eme)\b|[3456]e|[3456]eme/.test(t))return"Collège";if(/cm1|cm2|ce1|ce2|\bcp\b/.test(t))return"Primaire";return"À préciser"}
function emploiData(){const t=today(),J=["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"],JO=["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"],act=S.st.filter(s=>!s.archive),fk=s=>intl(s.parent_tel)||("id"+s.id);
 const sea=S.se.filter(x=>x.status=="prévue"&&x.duree>0&&x.date>=t&&x.student_id).map(x=>({...x,jour:J[new Date(x.date+"T12:00:00Z").getUTCDay()],h:(x.heure||"").slice(0,5)}));
 const rows=[];act.forEach(s=>{const mine={};sea.filter(x=>x.student_id==s.id).forEach(x=>{const k=x.jour+"|"+x.h+"|"+(x.matiere||"");mine[k]=mine[k]||{jour:x.jour,h:x.h,mat:x.matiere||"",n:0,lieu:x.lieu||""};mine[k].n++});
  Object.values(mine).forEach(v=>{const ens=act.filter(o=>o.id!=s.id&&fk(o)==fk(s)&&sea.some(x=>x.student_id==o.id&&x.jour==v.jour&&x.h==v.h)).map(o=>((o.prenom||"")+" "+o.nom).trim());
   rows.push({niv:niveau(s.classe),fam:((s.parent_nom||"").trim())||((s.prenom||"")+" "+s.nom).trim(),eleve:((s.prenom||"")+" "+s.nom).trim(),classe:s.classe||"",jour:v.jour,h:v.h,mat:v.mat,n:v.n,lieu:v.lieu,ens:ens.join(", ")})})});
 const ord={"Primaire":1,"Collège":2,"Lycée":3,"À préciser":4};return rows.sort((a,b)=>ord[a.niv]-ord[b.niv]||a.fam.localeCompare(b.fam)||JO.indexOf(a.jour)-JO.indexOf(b.jour)||a.h.localeCompare(b.h))}
function emploiHtml(){const Rw=emploiData();if(!Rw.length)return"<div class=card><h3>Emploi du temps par élève</h3><p>Aucun cours prévu pour le moment.</p></div>";
 let h="";["Primaire","Collège","Lycée","À préciser"].forEach(n=>{const g=Rw.filter(r=>r.niv==n);if(!g.length)return;h+=`<h3 style="margin-top:14px">${n}</h3>`;[...new Set(g.map(r=>r.fam))].forEach(f=>{h+=`<div class=card><b>${e(f)}</b><div style="overflow-x:auto"><table style="width:100%;font-size:.85rem;border-collapse:collapse"><tr><th align=left>Élève</th><th align=left>Classe</th><th align=left>Jour</th><th>Heure</th><th align=left>Matière</th><th>Séances (4 sem.)</th><th align=left>Lieu</th><th align=left>Avec</th></tr>${g.filter(r=>r.fam==f).map(r=>`<tr><td>${e(r.eleve)}</td><td>${e(r.classe)}</td><td>${r.jour}</td><td align=center>${r.h}</td><td>${e(r.mat)}</td><td align=center>${r.n}</td><td>${e(r.lieu)}</td><td>${e(r.ens)}</td></tr>`).join("")}</table></div></div>`})});
 return `<div class=card><h3>Emploi du temps par élève</h3><p><small>Calculé à partir des cours prévus. Les élèves d’une même famille sont regroupés.</small></p><button class=s onclick="emploiCsv()">Télécharger en Excel (CSV)</button></div>`+h}
function emploiCsv(){const Rw=emploiData(),cols=["Niveau","Famille","Élève","Classe","Jour","Heure","Matière","Séances (4 sem.)","Lieu","Avec"];const lines=[cols.join(";")].concat(Rw.map(r=>[r.niv,r.fam,r.eleve,r.classe,r.jour,r.h,r.mat,r.n,r.lieu,r.ens].map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv"}));a.download="emploi-du-temps.csv";document.body.appendChild(a);a.click();a.remove()}
function seances(){const t=today(),L=a=>a.map(x=>`<div class=card>${dt(x.date)} ${(x.heure||"").slice(0,5)}, <b>${e(nom(x.student_id))}</b>, ${e(x.matiere)}, ${x.duree} min <span class=b>${x.status}</span> <button class=s data-a=es data-i=${x.id}>Ouvrir</button></div>`).join("")||"<p>Aucune.</p>";

 <div class=card><h3>Emploi du temps de la semaine</h3>${emploiParent(c)}</div>
 <div class=card><h3>Planning</h3>${c.planning.map(p=>`<div>${dt(p.date)} ${(p.heure||"").slice(0,5)}, ${e(p.matiere)}, ${p.duree} min <span class=b>${p.status}</span></div>`).join("")||"Aucune séance."}</div>
 <div class=card><h3>Documents (rapports, reçus, rappels)</h3>${c.documents.map(d=>`<div>${L[d.kind]||d.kind} ${e(d.periode)} (${d.date.slice(0,10)}) <button class=s data-a=pdoc data-i="${e(d.file)}">Ouvrir</button></div>`).join("")||"Aucun document pour le moment."}</div>
 <div class=card><h3>Paiements</h3>${(()=>{let t=0;return [...c.paiements].reverse().map(p=>{t+=+p.amount;return `<div>${dt(p.date)} ${F(p.amount)} (${e(p.mode)}), reste à payer : ${F(Math.max(0,c.du-t))}</div>`}).reverse().join("")})()||"Aucun paiement."}</div>
 ${c.paiements.length?`<div class=card style="border-color:var(--o)"><b>Merci de tout cœur !</b><br>Votre confiance et votre régularité nous touchent énormément. Grâce à vous, nous accompagnons votre enfant avec toute notre énergie jusqu’à sa réussite.</div>`:""}<div class=card><h3>Message au répétiteur</h3><textarea id=pm-${c.student_id} rows=3 placeholder="Votre demande ou question"></textarea><button data-a=psend data-i=${c.student_id}>Envoyer</button>${c.messages.map(m=>`<div><small>${m.date.slice(0,10)}, ${m.sender=="parent"?"Vous":"Répétiteur"}</small><br>${e(m.body)}</div>`).join("")}</div>`}).join("")||"<div class=card>Aucun enfant n’est encore lié à votre compte. Contactez le répétiteur.</div>"}
async function h256(t){const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function bioOK(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch{return false}}
async function bioSetup(){const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"Maître Pro",id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"repetiteur",displayName:"Répétiteur"},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});localStorage.setItem("mp-bio",b64(c.rawId));return true}
async function bioUnlock(){const a=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:"public-key",id:unb64(localStorage.getItem("mp-bio"))}],userVerification:"required",timeout:60000}});return !!a}
function lockScreen(){const set=!localStorage.getItem("mp-pin");$("#m").innerHTML=`<div class=card><h3>${set?"Créez votre code d’accès":"Code d’accès"}</h3><p><small>${set?"Ce code protège l’application sur ce téléphone. Il n’est pas envoyé en ligne. Choisissez 4 à 6 chiffres.":"Entrez votre code pour ouvrir l’application."}</small></p><input id=pin type=password inputmode=numeric maxlength=6 placeholder="Code (4 à 6 chiffres)"><button id=pok>${set?"Enregistrer le code":"Ouvrir"}</button>${set?"":'<p><small><a href="#" id=rpin>Code oublié ? Réinitialiser avec mon mot de passe</a></small></p>'}</div>`;
 $("#pok").onclick=async()=>{const v=$("#pin").value.trim();if(!/^\d{4,6}$/.test(v))return alert("Le code doit contenir 4 à 6 chiffres.");const h=await h256(v);if(set){localStorage.setItem("mp-pin",h);S.unlocked=true;render()}else if(h==localStorage.getItem("mp-pin")){S.unlocked=true;render()}else alert("Code incorrect.")};
 bioOK().then(ok=>{if(!ok)return;const card=document.querySelector("#m .card");if(!card)return;const d=document.createElement("div");d.style.marginTop="10px";
  if(localStorage.getItem("mp-bio")){d.innerHTML='<button id=bio class=s>Ouvrir avec l’empreinte</button>';card.appendChild(d);document.getElementById("bio").onclick=async()=>{try{if(await bioUnlock()){S.unlocked=true;render()}}catch{alert("Empreinte non reconnue. Utilisez votre code.")}}}
  else{d.innerHTML='<button id=bios class=s>Activer l’empreinte sur ce téléphone</button>';card.appendChild(d);document.getElementById("bios").onclick=async()=>{try{await bioSetup();alert("Empreinte activée. Vous pouvez maintenant ouvrir avec l’empreinte.");lockScreen()}catch{alert("Activation annulée ou impossible sur ce téléphone.")}}}});
 const rp=$("#rpin");if(rp)rp.onclick=async ev=>{ev.preventDefault();const pw=prompt("Entrez le mot de passe de votre compte :");if(!pw)return;const r=await sb.auth.signInWithPassword({email:S.user.email,password:pw});if(r.error)return alert("Mot de passe incorrect.");localStorage.removeItem("mp-pin");S.unlocked=false;render()}}
document.addEventListener("visibilitychange",()=>{if(document.hidden){S.hiddenAt=Date.now()}else if(S.hiddenAt&&Date.now()-S.hiddenAt>60000&&S.user&&!isP()){S.unlocked=false;render()}});
function login(){$("#m").innerHTML=`<div class=card><h3>Connexion privée</h3><input id=em type=text inputmode=email placeholder="E-mail ou numéro de téléphone" autocomplete=username><input id=pw type=password placeholder="Mot de passe" autocomplete=current-password><label><input type=checkbox style="width:auto" onchange="document.getElementById('pw').type=this.checked?'text':'password'"> Afficher le mot de passe</label><button id=go>Se connecter</button><p><a href="#" id=fg>Mot de passe oublié ?</a></p><p><small>Pas encore de compte répétiteur ? <a href="#" id=su>Créer un compte</a></small></p></div>`;
 $("#fg").onclick=async ev=>{ev.preventDefault();const em=$("#em").value;if(!em)return alert("Entrez d’abord votre e-mail.");if(!em.includes("@"))return alert("La récupération par e-mail ne marche pas avec un numéro. Contactez le répétiteur pour un nouveau mot de passe.");const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});alert(r.error?r.error.message:"Si cet e-mail existe, un lien de réinitialisation vient d’être envoyé. Vérifiez votre boîte mail et les spams.")};
 $("#su").onclick=async ev=>{ev.preventDefault();const r=await sb.auth.signUp({email:$("#em").value,password:$("#pw").value,options:{emailRedirectTo:location.origin+location.pathname}});alert(r.error?r.error.message:"Compte créé. Si un e-mail de confirmation est demandé, ouvrez le lien reçu, puis connectez-vous.")};
 $("#go").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:idMail($("#em").value),password:$("#pw").value});if(r.error)alert("Connexion impossible : "+r.error.message)}}
function render(){const on=!!S.user;$("nav").style.display=$("#bk").style.display=$("#qr").style.display=on&&!isP()?"":"none";$("#lo").style.display=on?"":"none";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==S.tab));
 if(!on)return login();if(isP())return parentView();if(!S.unlocked)return lockScreen();if(S.cur&&S.tab=="st")return dossier();({hm:home,st:eleves,se:seances,pa:paiements,dc:docs})[S.tab]();if(S.tab!=="hm"||S.cur){const b=document.createElement("button");b.className="s";b.textContent="← Accueil";b.style.marginBottom="10px";b.onclick=()=>{S.tab="hm";S.cur=null;render()};$("#m").prepend(b)}}
$("#m").addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(b)A[b.dataset.a](b.dataset.i)});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.cur=null;render()});
$("#lo").onclick=()=>{localStorage.removeItem("cache");sb.auth.signOut()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
$("#m").addEventListener("change",async ev=>{const k=ev.target.dataset.k,f=ev.target.files?.[0];if(!k||!f)return;const r=await sb.storage.from("photos").upload(`${S.uid}/settings/${k}.png`,f,{upsert:true,contentType:f.type});if(r.error)return alert(r.error.message);await load();render();alert("Enregistré.")});
$("#qr").onclick=()=>{$("#m").innerHTML=`<div class=card><h3>Ouvrir sur un autre téléphone</h3><p>Scannez ce code avec l’appareil photo du téléphone, puis connectez-vous.</p><div id=qc style="background:#fff;padding:12px;display:inline-block"></div><br><button class=s data-a=bk>Retour</button></div>`;new QRCode($("#qc"),{text:location.href.split("#")[0],width:200,height:200})};
$("#bk").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify({students:S.st,sessions:S.se,payments:S.pa,documents:S.dc,grades:S.gr},null,1)]));a.download=`sauvegarde-${today()}.json`;a.click()};
function newpw(){$("#m").innerHTML=`<div class=card><h3>Nouveau mot de passe</h3><input id=np1 type=password placeholder="Nouveau mot de passe (8 caractères minimum)" autocomplete=new-password><label><input type=checkbox style="width:auto" onchange="document.getElementById('np1').type=this.checked?'text':'password'"> Afficher le mot de passe</label><button id=sv>Enregistrer</button></div>`;
 $("#sv").onclick=async()=>{const p=$("#np1").value;if(p.length<8)return alert("8 caractères minimum.");const r=await sb.auth.updateUser({password:p});if(r.error)return alert(r.error.message);alert("Mot de passe changé.");await load();render()}}
sb.auth.onAuthStateChange((ev,s)=>{S.user=s?.user||null;S.uid=S.user?.id;setTimeout(async()=>{if(ev=="PASSWORD_RECOVERY")return newpw();if(S.user)await(isP()?loadP():load());render()},0)});
</script></body></html>
